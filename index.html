<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover：让页面在 iPhone 刘海屏、圆角屏上也能正确留边 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152944">
  <meta name="description" content="ドラマで中国語を学ぼう。全14課の本文・単語を、音声とピンイン、日本語訳で学べます。">
  <meta name="format-detection" content="telephone=no">
  <!-- 手机「ホーム画面に追加」时的图标和名称 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DRAMA">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>DRAMA | ドラマで中国語を学ぼう</title>

  <!-- 修改了 css / js 后，把 ?v= 后面的数字加 1，学生的浏览器就会读取新版本 -->
  <link rel="stylesheet" href="app.css?v=7">
  <script src="config.js?v=7" defer></script>
  <script src="course-data.js?v=7" defer></script>
  <script src="reading-alignment.js?v=7" defer></script>
  <script src="app.js?v=7" defer></script>
</head>
<body>
  <!-- 以下各区域的内容都由 app.js 根据 config.js 生成 -->
  <a class="skip" href="#main">本文へスキップ</a>
  <aside class="sidebar" id="sidebar" aria-label="課を選ぶ"></aside>
  <button class="veil" id="veil" aria-label="メニューを閉じる" hidden></button>
  <div class="workspace">
    <header class="topbar" id="topbar"></header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer" id="footer"></footer>
  </div>
  <div id="player" class="player" hidden></div>
  <div id="status" class="toast" role="status" aria-live="polite"></div>
  <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
  <noscript>この教材を利用するには JavaScript を有効にしてください。</noscript>
</body>
</html>
